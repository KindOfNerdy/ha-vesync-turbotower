update_devices:

# --- Turbo Tower fork: dual-basket air fryer -------------------------------------

start_cook:
  fields:
    device_id:
      selector:
        device:
          filter:
            - integration: vesync
    basket:
      required: true
      default: "1"
      selector:
        select:
          translation_key: start_basket
          options: ["1", "2", "both"]
    program:
      required: true
      default: airfry
      selector:
        select:
          translation_key: program
          options: [airfry, bake, roast, grill, reheat, dry, proof]
    temperature:
      selector:
        number:
          min: 30
          max: 230
          step: 1
          unit_of_measurement: "°C"
          mode: box
    duration:
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    send_only:
      default: false
      selector:
        boolean:
    basket_2:
      collapsed: true
      fields:
        mode:
          default: separate
          selector:
            select:
              translation_key: start_mode
              options: [separate, sync, match]
        program_2:
          selector:
            select:
              translation_key: program
              options: [airfry, bake, roast, grill, reheat, dry, proof]
        temperature_2:
          selector:
            number:
              min: 30
              max: 230
              step: 1
              unit_of_measurement: "°C"
              mode: box
        duration_2:
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box

set_preset:
  fields:
    device_id:
      selector:
        device:
          filter:
            - integration: vesync
    program:
      required: true
      selector:
        select:
          translation_key: program
          options: [airfry, bake, roast, grill, reheat, dry, proof]
    temperature:
      required: true
      selector:
        number:
          min: 30
          max: 230
          step: 1
          unit_of_measurement: "°C"
          mode: box
    duration:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

reset_preset:
  fields:
    device_id:
      selector:
        device:
          filter:
            - integration: vesync
    program:
      required: true
      selector:
        select:
          translation_key: program
          options: [airfry, bake, roast, grill, reheat, dry, proof]
